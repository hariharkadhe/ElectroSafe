<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ElectroSafe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { animation: none; }
        .auth-page {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; background: var(--bg-base);
            position: relative; overflow: hidden; animation: fadeInUp 0.5s ease both;
        }
        .auth-page::before {
            content: ''; position: fixed; top: -200px; left: -200px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,212,255,0.07), transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .auth-page::after {
            content: ''; position: fixed; bottom: -200px; right: -200px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,102,255,0.07), transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .auth-card {
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 24px; padding: 44px 40px;
            width: 100%; max-width: 420px; position: relative;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 40px rgba(0,212,255,0.05);
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 2px; background: linear-gradient(90deg, #00d4ff, #0066ff);
            border-radius: 24px 24px 0 0;
        }
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo .logo-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,102,255,0.15));
            border: 1px solid rgba(0,212,255,0.3); border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin: 0 auto 12px;
        }
        .auth-logo h2 {
            font-size: 1.5rem; font-weight: 800;
            background: linear-gradient(135deg, #fff, #00d4ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 4px;
        }
        .auth-logo p { font-size: 0.85rem; color: var(--text-muted); }

        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px 20px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; color: var(--text-primary);
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: all 0.25s; margin-bottom: 20px; font-family: inherit;
        }
        .btn-google:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); transform: translateY(-1px); }
        .btn-google img { width: 18px; height: 18px; }

        .auth-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .auth-divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
        .auth-divider span { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

        .auth-form .form-group { margin-bottom: 16px; }
        .auth-form label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .auth-form input {
            width: 100%; padding: 11px 14px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text-primary);
            font-size: 0.92rem; font-family: inherit; transition: all 0.2s;
        }
        .auth-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,212,255,0.12); }
        .input-wrapper { position: relative; }
        .input-wrapper input { padding-right: 42px; }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--primary); }

        /* Password strength */
        .strength-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px; margin-bottom: 4px; }
        .strength-fill { height: 100%; width: 0%; border-radius: 2px; transition: width 0.3s, background 0.3s; }
        .strength-label { font-size: 0.75rem; color: var(--text-muted); }

        .btn-auth {
            width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none; border-radius: 12px; color: #fff; cursor: pointer;
            transition: all 0.25s; margin-top: 8px; font-family: inherit;
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.3); }
        .btn-auth:active { transform: translateY(0); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .auth-switch { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted); }
        .auth-switch a { color: var(--primary); font-weight: 600; text-decoration: none; }

        .auth-alert {
            padding: 10px 14px; border-radius: 10px; font-size: 0.85rem;
            margin-bottom: 16px; display: none; align-items: center; gap: 8px;
        }
        .auth-alert.error { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.25); color: #ff6b7a; display: flex; }
        .auth-alert.success { background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.25); color: #00e676; display: flex; }

        .back-home {
            position: fixed; top: 20px; left: 20px;
            display: flex; align-items: center; gap: 8px;
            font-size: 0.85rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s; z-index: 10;
        }
        .back-home:hover { color: var(--primary); }
        @media (max-width: 480px) { .auth-card { padding: 32px 24px; } }
    </style>
</head>
<body>
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">⚡</div>
                <h2>Create Account</h2>
                <p>Join ElectroSafe to track your complaints</p>
            </div>

            <div class="auth-alert" id="authAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="authAlertMsg"></span>
            </div>

            <!-- Google Identity Services Container -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE"
                 data-context="signup"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signup_with"
                 data-size="large"
                 data-logo_alignment="left"
                 style="display: flex; justify-content: center; margin-bottom: 20px;">
            </div>

            <div class="auth-divider"><hr><span>or create with email</span><hr></div>

            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Your full name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupPassword" placeholder="Min. 8 characters"
                            required minlength="8" autocomplete="new-password"
                            oninput="checkStrength(this.value)">
                        <button type="button" class="toggle-password" onclick="togglePwd('signupPassword', this)"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <span class="strength-label" id="strengthLabel">Enter a password</span>
                </div>
                <div class="form-group">
                    <label for="signupConfirm">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupConfirm" placeholder="Repeat your password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePwd('signupConfirm', this)"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn-auth" id="signupBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-switch">Already have an account? <a href="login.html">Sign in →</a></div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        if (localStorage.getItem('es_token')) window.location.href = 'index.html';

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('authAlert');
            el.className = 'auth-alert ' + type;
            document.getElementById('authAlertMsg').textContent = msg;
        }

        async function handleCredentialResponse(response) {
            document.getElementById('authAlert').className = 'auth-alert';
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('es_token', data.token);
                    localStorage.setItem('es_user', JSON.stringify(data.user));
                    showAlert('Account created with Google successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 900);
                } else {
                    showAlert(data.message || 'Google Sign-Up failed.');
                }
            } catch (err) {
                showAlert('Could not connect to server. Please try again.');
            }
        }

        function checkStrength(val) {
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            let score = 0;
            if (val.length >= 8)            score++;
            if (/[A-Z]/.test(val))          score++;
            if (/[0-9]/.test(val))          score++;
            if (/[^A-Za-z0-9]/.test(val))   score++;
            const levels = [
                { w: '0%',   bg: 'transparent', txt: 'Enter a password' },
                { w: '25%',  bg: '#ff4757',      txt: 'Weak' },
                { w: '50%',  bg: '#f5c518',      txt: 'Fair' },
                { w: '75%',  bg: '#00d4ff',      txt: 'Good' },
                { w: '100%', bg: 'linear-gradient(90deg,#00d4ff,#00e676)', txt: 'Strong ✓' },
            ];
            const lvl = val.length === 0 ? 0 : Math.max(1, score);
            fill.style.width = levels[lvl].w;
            fill.style.background = levels[lvl].bg;
            label.textContent = levels[lvl].txt;
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('authAlert').className = 'auth-alert';

            const name     = document.getElementById('signupName').value.trim();
            const email    = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm  = document.getElementById('signupConfirm').value;

            if (password !== confirm) { showAlert('Passwords do not match.'); return; }

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('es_token', data.token);
                    localStorage.setItem('es_user', JSON.stringify(data.user));
                    showAlert('Account created! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 900);
                } else {
                    showAlert(data.message || 'Registration failed.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            } catch (err) {
                showAlert('Could not connect to server. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });

        function togglePwd(id, btn) {
            const input = document.getElementById(id);
            const isText = input.type === 'text';
            input.type = isText ? 'password' : 'text';
            btn.innerHTML = isText ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        }
    </script>
</body>
</html>
