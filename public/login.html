<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ElectroSafe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { animation: none; }
        .auth-page {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            background: var(--bg-base);
            position: relative; overflow: hidden;
            animation: fadeInUp 0.5s ease both;
        }
        .auth-page::before {
            content: ''; position: fixed; top: -200px; left: -200px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,212,255,0.07), transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .auth-page::after {
            content: ''; position: fixed; bottom: -200px; right: -200px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,102,255,0.07), transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 24px; padding: 44px 40px;
            width: 100%; max-width: 420px; position: relative;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 40px rgba(0,212,255,0.05);
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 2px; background: linear-gradient(90deg, #00d4ff, #0066ff);
            border-radius: 24px 24px 0 0;
        }
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo .logo-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,102,255,0.15));
            border: 1px solid rgba(0,212,255,0.3); border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin: 0 auto 12px;
        }
        .auth-logo h2 {
            font-size: 1.5rem; font-weight: 800;
            background: linear-gradient(135deg, #fff, #00d4ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 4px;
        }
        .auth-logo p { font-size: 0.85rem; color: var(--text-muted); }

        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px 20px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; color: var(--text-primary);
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: all 0.25s; margin-bottom: 20px; font-family: inherit;
        }
        .btn-google:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); transform: translateY(-1px); }
        .btn-google img { width: 18px; height: 18px; }

        .auth-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .auth-divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
        .auth-divider span { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

        .auth-form .form-group { margin-bottom: 16px; }
        .auth-form label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .auth-form input {
            width: 100%; padding: 11px 14px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text-primary);
            font-size: 0.92rem; font-family: inherit; transition: all 0.2s;
        }
        .auth-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,212,255,0.12); }
        .input-wrapper { position: relative; }
        .input-wrapper input { padding-right: 42px; }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--primary); }
        .auth-forgot { text-align: right; margin-top: 6px; }
        .auth-forgot a { font-size: 0.8rem; color: var(--primary); text-decoration: none; opacity: 0.8; }
        .auth-forgot a:hover { opacity: 1; }

        .btn-auth {
            width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none; border-radius: 12px; color: #fff; cursor: pointer;
            transition: all 0.25s; margin-top: 8px; font-family: inherit;
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.3); }
        .btn-auth:active { transform: translateY(0); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .auth-switch { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted); }
        .auth-switch a { color: var(--primary); font-weight: 600; text-decoration: none; }

        .auth-alert {
            padding: 10px 14px; border-radius: 10px; font-size: 0.85rem;
            margin-bottom: 16px; display: none; align-items: center; gap: 8px;
        }
        .auth-alert.error { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.25); color: #ff6b7a; display: flex; }
        .auth-alert.success { background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.25); color: #00e676; display: flex; }

        .back-home {
            position: fixed; top: 20px; left: 20px;
            display: flex; align-items: center; gap: 8px;
            font-size: 0.85rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s; z-index: 10;
        }
        .back-home:hover { color: var(--primary); }
        @media (max-width: 480px) { .auth-card { padding: 32px 24px; } }
    </style>
</head>
<body>
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">⚡</div>
                <h2>Welcome Back</h2>
                <p>Sign in to your ElectroSafe account</p>
            </div>

            <div class="auth-alert" id="authAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="authAlertMsg"></span>
            </div>

            <!-- Google Identity Services Container -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left"
                 style="display: flex; justify-content: center; margin-bottom: 20px;">
            </div>

            <div class="auth-divider"><hr><span>or sign in with email</span><hr></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePwd('loginPassword', this)"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="auth-forgot"><a href="signup.html">Forgot password? Reset via new account</a></div>
                </div>
                <button type="submit" class="btn-auth" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="auth-switch">Don't have an account? <a href="signup.html">Create one →</a></div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem('es_token')) window.location.href = 'index.html';

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('authAlert');
            el.className = 'auth-alert ' + type;
            document.getElementById('authAlertMsg').textContent = msg;
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function handleCredentialResponse(response) {
            document.getElementById('authAlert').className = 'auth-alert';
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('es_token', data.token);
                    localStorage.setItem('es_user', JSON.stringify(data.user));
                    showAlert('Signed in with Google successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 900);
                } else {
                    showAlert(data.message || 'Google Sign-In failed.');
                }
            } catch (err) {
                showAlert('Could not connect to server. Please try again.');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            document.getElementById('authAlert').className = 'auth-alert';

            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('es_token', data.token);
                    localStorage.setItem('es_user', JSON.stringify(data.user));
                    showAlert('Signed in successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 900);
                } else {
                    showAlert(data.message || 'Sign in failed.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            } catch (err) {
                showAlert('Could not connect to server. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });

        function togglePwd(id, btn) {
            const input = document.getElementById(id);
            const isText = input.type === 'text';
            input.type = isText ? 'password' : 'text';
            btn.innerHTML = isText ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        }
    </script>
</body>
</html>
